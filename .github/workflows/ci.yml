name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host tests${{ matrix.san == '1' && ' (asan+ubsan)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        san: ["", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        env:
          SAN: ${{ matrix.san }}
        run: bash test/host/run_all.sh

  # example and target test app, link-checked for every tested target
  idf-build:
    name: ${{ matrix.app }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        app: [examples/read_meter, test_apps]
        target: [esp32, esp32c3, esp32c6, esp32s3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: esp_libmbus   # apps find the component by this directory name
      - name: Build
        working-directory: esp_libmbus/${{ matrix.app }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build